<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🚀 우주 슈팅 게임</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Courier New', monospace;
  touch-action: none;
}
canvas {
  border: 2px solid #0ff;
  box-shadow: 0 0 20px #0ff;
  image-rendering: pixelated;
}
#mobile-controls {
  display: none;
  position: fixed;
  bottom: 20px;
  left: 0; right: 0;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 100;
}
.ctrl-btn {
  width: 60px; height: 60px;
  border: 3px solid #0ff;
  border-radius: 50%;
  background: rgba(0,255,255,0.15);
  color: #0ff;
  font-size: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  -webkit-user-select: none;
}
.ctrl-btn:active { background: rgba(0,255,255,0.4); }
#move-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
#btn-up { grid-column: 2; }
#btn-left { grid-column: 1; grid-row: 2; }
#btn-right { grid-column: 3; grid-row: 2; }
#btn-down { grid-column: 2; grid-row: 2; }
@media (max-width: 768px) { #mobile-controls { display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="mobile-controls">
  <div id="move-btns">
    <button class="ctrl-btn" id="btn-up">▲</button>
    <button class="ctrl-btn" id="btn-left">◀</button>
    <button class="ctrl-btn" id="btn-down">▼</button>
    <button class="ctrl-btn" id="btn-right">▶</button>
  </div>
  <button class="ctrl-btn" id="btn-fire">●</button>
</div>
<script>
// ===== 캔버스 설정 =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function resizeCanvas() {
  canvas.width = Math.min(window.innerWidth - 20, 480);
  canvas.height = Math.min(window.innerHeight - 40, 640);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ===== 오디오 =====
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }
function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
  const t = audioCtx.currentTime;
  if (type === 'shoot') {
    osc.type='square'; osc.frequency.setValueAtTime(880,t);
    osc.frequency.exponentialRampToValueAtTime(220,t+0.1);
    gain.gain.exponentialRampToValueAtTime(0.001,t+0.1);
    osc.start(); osc.stop(t+0.1);
  } else if (type === 'explode') {
    osc.type='sawtooth'; osc.frequency.setValueAtTime(200,t);
    osc.frequency.exponentialRampToValueAtTime(50,t+0.3);
    gain.gain.exponentialRampToValueAtTime(0.001,t+0.3);
    osc.start(); osc.stop(t+0.3);
  } else if (type === 'hit') {
    osc.type='square'; osc.frequency.setValueAtTime(150,t);
    osc.frequency.exponentialRampToValueAtTime(40,t+0.4);
    gain.gain.exponentialRampToValueAtTime(0.001,t+0.4);
    osc.start(); osc.stop(t+0.4);
  } else if (type === 'gameover') {
    osc.type='square'; osc.frequency.setValueAtTime(440,t);
    osc.frequency.exponentialRampToValueAtTime(55,t+0.8);
    gain.gain.exponentialRampToValueAtTime(0.001,t+0.8);
    osc.start(); osc.stop(t+0.8);
  } else if (type === 'stageclear') {
    osc.type='square';
    osc.frequency.setValueAtTime(523,t);
    osc.frequency.setValueAtTime(659,t+0.1);
    osc.frequency.setValueAtTime(784,t+0.2);
    osc.frequency.setValueAtTime(1047,t+0.3);
    gain.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    osc.start(); osc.stop(t+0.5);
  } else if (type === 'bosshit') {
    osc.type='sawtooth'; osc.frequency.setValueAtTime(300,t);
    osc.frequency.exponentialRampToValueAtTime(100,t+0.15);
    gain.gain.exponentialRampToValueAtTime(0.001,t+0.15);
    osc.start(); osc.stop(t+0.15);
  } else if (type === 'powerup') {
    osc.type='sine'; osc.frequency.setValueAtTime(440,t);
    osc.frequency.setValueAtTime(660,t+0.08);
    osc.frequency.setValueAtTime(880,t+0.16);
    osc.frequency.setValueAtTime(1100,t+0.24);
    gain.gain.exponentialRampToValueAtTime(0.001,t+0.35);
    osc.start(); osc.stop(t+0.35);
  }
}

// ===== 게임 상태 =====
let score = 0, lives = 3, frameCount = 0;
let highScore = parseInt(localStorage.getItem('spaceShooterHigh')) || 0;
let gameState = 'title';
let stage = 1, enemiesKilled = 0, stageTransitionTimer = 0;

// 파워업 상태
let powerLevel = 0;       // 0=기본, 1=더블샷, 2=트리플+날개확장, 3=윙맨 추가
let powerTimer = 0;       // 파워업 지속시간
let shieldActive = false; // 보호막
let shieldTimer = 0;
let speedBoost = false;   // 속도 부스트
let speedTimer = 0;

const STAGE_CONFIG = [
  { name:'1단계: 초급', killGoal:10, spawnRate:70, enemySpeed:1.5, types:['normal'], color:'#4f4' },
  { name:'2단계: 중급', killGoal:15, spawnRate:55, enemySpeed:2.0, types:['normal','fast'], color:'#ff0' },
  { name:'3단계: 고급', killGoal:20, spawnRate:40, enemySpeed:2.5, types:['normal','fast','tank'], color:'#f80' },
  { name:'4단계: 위험', killGoal:25, spawnRate:30, enemySpeed:3.0, types:['normal','fast','tank','shooter'], color:'#f44' },
  { name:'5단계: 보스', killGoal:0, spawnRate:80, enemySpeed:2.0, types:['normal','fast'], color:'#f0f' }
];

// ===== 별 배경 =====
const stars = [];
function initStars() {
  stars.length = 0;
  for (let i = 0; i < 80; i++) {
    stars.push({ x:Math.random()*canvas.width, y:Math.random()*canvas.height,
      speed:1+Math.random()*3, size:Math.random()<0.3?2:1, brightness:0.3+Math.random()*0.7 });
  }
}
initStars();
function updateStars() {
  for (const s of stars) { s.y+=s.speed; if(s.y>canvas.height){s.y=0;s.x=Math.random()*canvas.width;} }
}
function drawStars() {
  for (const s of stars) {
    ctx.fillStyle=`rgba(255,255,255,${s.brightness})`;
    ctx.fillRect(Math.floor(s.x),Math.floor(s.y),s.size,s.size);
  }
}

// ===== 플레이어 =====
const player = { x:0, y:0, w:30, h:30, speed:5, invincible:0 };
function resetPlayer() {
  player.x = canvas.width/2 - player.w/2;
  player.y = canvas.height - 60;
  player.invincible = 0;
}

function drawPlayer() {
  if (player.invincible > 0 && Math.floor(frameCount/4)%2===0) return;
  const px = Math.floor(player.x), py = Math.floor(player.y);
  const wide = powerLevel >= 2; // 날개 확장

  // 보호막
  if (shieldActive) {
    ctx.strokeStyle = frameCount%8<4 ? '#0ff' : '#08f';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px+15, py+15, 22, 0, Math.PI*2);
    ctx.stroke();
  }

  // 메인 우주선
  ctx.fillStyle = '#0ff';
  ctx.fillRect(px+12, py, 6, 6);
  ctx.fillRect(px+9, py+6, 12, 6);
  ctx.fillRect(px+6, py+12, 18, 6);
  ctx.fillRect(px+3, py+18, 24, 6);
  if (wide) {
    // 확장 날개
    ctx.fillStyle = '#08f';
    ctx.fillRect(px-6, py+20, 42, 6);
    ctx.fillRect(px-9, py+24, 48, 4);
    ctx.fillStyle = '#0ff';
    ctx.fillRect(px, py+24, 30, 6);
  } else {
    ctx.fillRect(px, py+24, 30, 6);
  }
  // 엔진
  ctx.fillStyle = frameCount%6<3 ? '#ff0' : '#f80';
  ctx.fillRect(px+12, py+28, 6, 4);
  ctx.fillRect(px+3, py+28, 4, 3);
  ctx.fillRect(px+23, py+28, 4, 3);

  // 윙맨 (powerLevel 3)
  if (powerLevel >= 3) {
    drawWingman(px - 30, py + 10);
    drawWingman(px + player.w + 10, py + 10);
  }
}

function drawWingman(wx, wy) {
  ctx.fillStyle = '#0af';
  ctx.fillRect(wx+5, wy, 4, 4);
  ctx.fillRect(wx+3, wy+4, 8, 4);
  ctx.fillRect(wx+1, wy+8, 12, 4);
  ctx.fillRect(wx, wy+12, 14, 4);
  ctx.fillStyle = frameCount%6<3 ? '#ff0' : '#f80';
  ctx.fillRect(wx+5, wy+15, 4, 3);
}

// ===== 총알 =====
const bullets = [];
let shootCooldown = 0;

function shoot() {
  if (shootCooldown > 0) return;
  const cx = player.x + player.w/2;
  const py = player.y - 4;

  if (powerLevel === 0) {
    bullets.push({x:cx-2, y:py, w:4, h:10});
  } else if (powerLevel === 1) {
    bullets.push({x:cx-7, y:py, w:4, h:10});
    bullets.push({x:cx+3, y:py, w:4, h:10});
  } else if (powerLevel === 2) {
    bullets.push({x:cx-2, y:py-4, w:4, h:10});
    bullets.push({x:cx-10, y:py, w:4, h:10});
    bullets.push({x:cx+6, y:py, w:4, h:10});
  } else if (powerLevel >= 3) {
    bullets.push({x:cx-2, y:py-4, w:4, h:10});
    bullets.push({x:cx-10, y:py, w:4, h:10});
    bullets.push({x:cx+6, y:py, w:4, h:10});
    // 윙맨 총알
    bullets.push({x:player.x-23, y:player.y+6, w:3, h:8});
    bullets.push({x:player.x+player.w+15, y:player.y+6, w:3, h:8});
  }
  shootCooldown = powerLevel >= 2 ? 8 : 12;
  playSound('shoot');
}

function updateBullets() {
  for (let i=bullets.length-1; i>=0; i--) {
    bullets[i].y -= 9;
    if (bullets[i].y < -10) bullets.splice(i,1);
  }
  if (shootCooldown > 0) shootCooldown--;
}

function drawBullets() {
  for (const b of bullets) {
    ctx.fillStyle = powerLevel>=2 ? '#0ff' : '#ff0';
    ctx.fillRect(Math.floor(b.x), Math.floor(b.y), b.w, b.h);
    ctx.fillStyle = '#fff';
    ctx.fillRect(Math.floor(b.x)+1, Math.floor(b.y), 2, b.h);
  }
}

// ===== 아이템 =====
const items = [];
// 타입: 'power'(파워업), 'shield'(보호막), 'speed'(속도), 'life'(목숨), 'bomb'(화면폭탄)
const ITEM_TYPES = [
  { type:'power', color:'#f80', label:'P', desc:'화력 업그레이드' },
  { type:'shield', color:'#08f', label:'S', desc:'보호막 10초' },
  { type:'speed', color:'#0f0', label:'▲', desc:'속도 부스트 8초' },
  { type:'life', color:'#f4f', label:'♥', desc:'목숨 +1' },
  { type:'bomb', color:'#ff0', label:'B', desc:'화면 폭탄' }
];

let itemSpawnTimer = 0;
let itemMessage = '';
let itemMsgTimer = 0;

function spawnItem(x, y) {
  // 적 처치 시 15% 확률로 아이템 드롭
  if (Math.random() > 0.15) return;
  const roll = Math.random();
  let type;
  if (roll < 0.35) type = 'power';
  else if (roll < 0.55) type = 'shield';
  else if (roll < 0.72) type = 'speed';
  else if (roll < 0.87) type = 'life';
  else type = 'bomb';
  const info = ITEM_TYPES.find(t => t.type === type);
  items.push({ x, y, w:18, h:18, type, color:info.color, label:info.label, vy:2, frame:0 });
}

function updateItems() {
  for (let i=items.length-1; i>=0; i--) {
    items[i].y += items[i].vy;
    items[i].frame++;
    if (items[i].y > canvas.height+20) items.splice(i,1);
  }
  if (itemMsgTimer > 0) itemMsgTimer--;
}

function drawItems() {
  for (const it of items) {
    const ix = Math.floor(it.x), iy = Math.floor(it.y);
    const pulse = Math.sin(it.frame*0.15)*2;
    // 배경 박스
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(ix-1, iy-1, 20, 20);
    ctx.strokeStyle = it.color;
    ctx.lineWidth = 2;
    ctx.strokeRect(ix-1+pulse, iy-1, 20, 20);
    // 라벨
    ctx.fillStyle = it.color;
    ctx.font = 'bold 13px "Courier New"';
    ctx.textAlign = 'center';
    ctx.fillText(it.label, ix+9, iy+14);
  }
}

function collectItem(item) {
  const info = ITEM_TYPES.find(t => t.type === item.type);
  itemMessage = info.desc;
  itemMsgTimer = 90;
  playSound('powerup');

  if (item.type === 'power') {
    powerLevel = Math.min(powerLevel + 1, 3);
    powerTimer = 600; // 10초
  } else if (item.type === 'shield') {
    shieldActive = true;
    shieldTimer = 600;
  } else if (item.type === 'speed') {
    speedBoost = true;
    speedTimer = 480;
  } else if (item.type === 'life') {
    lives = Math.min(lives + 1, 5);
  } else if (item.type === 'bomb') {
    // 화면의 모든 적 제거
    for (const e of enemies) {
      createExplosion(e.x+e.w/2, e.y+e.h/2, '#ff0');
      score += 10;
      enemiesKilled++;
    }
    enemies.length = 0;
    enemyBullets.length = 0;
    if (boss) { boss.hp -= 10; playSound('bosshit'); }
  }
}

function updatePowerTimers() {
  if (powerTimer > 0) { powerTimer--; if (powerTimer<=0) powerLevel = Math.max(powerLevel-1, 0); }
  if (shieldTimer > 0) { shieldTimer--; if (shieldTimer<=0) shieldActive = false; }
  if (speedTimer > 0) { speedTimer--; if (speedTimer<=0) speedBoost = false; }
}

// ===== 적 =====
const enemies = [];
let enemySpawnTimer = 0;

function spawnEnemy() {
  const cfg = STAGE_CONFIG[stage-1];
  const typePool = cfg.types;
  const type = typePool[Math.floor(Math.random()*typePool.length)];
  let w,h,hp,speed;
  if (type==='normal'){w=28;h=24;hp=1;speed=cfg.enemySpeed;}
  else if (type==='fast'){w=24;h=24;hp=1;speed=cfg.enemySpeed*1.5;}
  else if (type==='tank'){w=32;h=28;hp=3;speed=cfg.enemySpeed*0.7;}
  else if (type==='shooter'){w=26;h=24;hp=2;speed=cfg.enemySpeed*0.9;}
  enemies.push({ x:Math.random()*(canvas.width-w), y:-30, w,h,hp,speed,type, frame:0, shootTimer:60 });
}

function updateEnemies() {
  const cfg = STAGE_CONFIG[stage-1];
  enemySpawnTimer++;
  if (enemySpawnTimer >= cfg.spawnRate) { spawnEnemy(); enemySpawnTimer=0; }
  for (let i=enemies.length-1; i>=0; i--) {
    enemies[i].y += enemies[i].speed;
    enemies[i].frame++;
    if (enemies[i].type==='shooter') {
      enemies[i].shootTimer--;
      if (enemies[i].shootTimer<=0) {
        enemyBullets.push({x:enemies[i].x+enemies[i].w/2-2, y:enemies[i].y+enemies[i].h, w:4, h:8});
        enemies[i].shootTimer = 80+Math.random()*40;
      }
    }
    if (enemies[i].y > canvas.height+30) enemies.splice(i,1);
  }
}

function drawEnemies() {
  for (const e of enemies) {
    const ex=Math.floor(e.x), ey=Math.floor(e.y);
    if (e.type==='normal') {
      ctx.fillStyle='#f44';
      ctx.fillRect(ex+6,ey,16,6); ctx.fillRect(ex+3,ey+6,22,6);
      ctx.fillRect(ex,ey+12,28,6); ctx.fillRect(ex+3,ey+18,22,6);
      ctx.fillStyle='#fff';
      ctx.fillRect(ex+7,ey+10,4,4); ctx.fillRect(ex+17,ey+10,4,4);
    } else if (e.type==='fast') {
      ctx.fillStyle='#f0f';
      ctx.fillRect(ex+9,ey,6,6); ctx.fillRect(ex+6,ey+6,12,6);
      ctx.fillRect(ex+3,ey+12,18,6); ctx.fillRect(ex,ey+18,24,6);
    } else if (e.type==='tank') {
      ctx.fillStyle='#888';
      ctx.fillRect(ex+4,ey,24,8); ctx.fillRect(ex,ey+8,32,12);
      ctx.fillRect(ex+4,ey+20,24,8);
      ctx.fillStyle='#f80';
      ctx.fillRect(ex+10,ey+10,4,4); ctx.fillRect(ex+18,ey+10,4,4);
      ctx.fillStyle='#0f0';
      ctx.fillRect(ex,ey-5,(e.hp/3)*e.w,3);
    } else if (e.type==='shooter') {
      ctx.fillStyle='#0f8';
      ctx.fillRect(ex+5,ey,16,6); ctx.fillRect(ex+2,ey+6,22,6);
      ctx.fillRect(ex,ey+12,26,6); ctx.fillRect(ex+4,ey+18,18,6);
      ctx.fillStyle='#ff0'; ctx.fillRect(ex+10,ey+20,6,4);
    }
  }
}

// ===== 적 총알 =====
const enemyBullets = [];
function updateEnemyBullets() {
  for (let i=enemyBullets.length-1; i>=0; i--) {
    enemyBullets[i].y += 4;
    if (enemyBullets[i].y > canvas.height+10) enemyBullets.splice(i,1);
  }
}
function drawEnemyBullets() {
  ctx.fillStyle='#f84';
  for (const b of enemyBullets) ctx.fillRect(Math.floor(b.x),Math.floor(b.y),b.w,b.h);
}

// ===== 보스 =====
let boss = null;
function createBoss() {
  boss = { x:canvas.width/2-50, y:-80, w:100, h:60,
    hp:50, maxHp:50, speed:1.5, dir:1,
    phase:'enter', shootTimer:0, patternTimer:0, pattern:0 };
}
function updateBoss() {
  if (!boss) return;
  if (boss.phase==='enter') { boss.y+=1; if(boss.y>=40) boss.phase='fight'; return; }
  boss.x += boss.speed*boss.dir;
  if (boss.x<=10||boss.x>=canvas.width-boss.w-10) boss.dir*=-1;
  boss.shootTimer++; boss.patternTimer++;
  if (boss.patternTimer>300){boss.pattern=(boss.pattern+1)%3; boss.patternTimer=0;}
  if (boss.pattern===0 && boss.shootTimer>=30) {
    enemyBullets.push({x:boss.x+20,y:boss.y+boss.h,w:4,h:8});
    enemyBullets.push({x:boss.x+boss.w/2-2,y:boss.y+boss.h,w:4,h:8});
    enemyBullets.push({x:boss.x+boss.w-24,y:boss.y+boss.h,w:4,h:8});
    boss.shootTimer=0;
  } else if (boss.pattern===1 && boss.shootTimer>=15) {
    enemyBullets.push({x:boss.x+boss.w/2-2,y:boss.y+boss.h,w:4,h:8});
    boss.shootTimer=0;
  } else if (boss.pattern===2 && boss.shootTimer>=45) {
    for(let i=0;i<5;i++) enemyBullets.push({x:boss.x+boss.w/2-2+(i-2)*15,y:boss.y+boss.h,w:4,h:8});
    boss.shootTimer=0;
  }
  if (boss.hp<=0) {
    createExplosion(boss.x+boss.w/2,boss.y+boss.h/2,'#f0f');
    createExplosion(boss.x+20,boss.y+20,'#ff0');
    createExplosion(boss.x+boss.w-20,boss.y+20,'#f80');
    score+=100; boss=null;
    gameState='stageclear'; stageTransitionTimer=180;
    playSound('stageclear');
  }
}
function drawBoss() {
  if (!boss) return;
  const bx=Math.floor(boss.x), by=Math.floor(boss.y);
  ctx.fillStyle='#a0f';
  ctx.fillRect(bx+10,by,80,10); ctx.fillRect(bx+5,by+10,90,15);
  ctx.fillRect(bx,by+25,100,20); ctx.fillRect(bx+10,by+45,80,15);
  ctx.fillStyle='#f00';
  ctx.fillRect(bx+25,by+30,10,10); ctx.fillRect(bx+65,by+30,10,10);
  ctx.fillStyle=frameCount%10<5?'#ff0':'#f80';
  ctx.fillRect(bx+42,by+28,16,16);
  // HP바
  ctx.fillStyle='#333'; ctx.fillRect(bx,by-12,boss.w,8);
  const r=boss.hp/boss.maxHp;
  ctx.fillStyle=r>0.5?'#0f0':r>0.25?'#ff0':'#f00';
  ctx.fillRect(bx,by-12,boss.w*r,8);
  ctx.strokeStyle='#fff'; ctx.strokeRect(bx,by-12,boss.w,8);
}

// ===== 파티클 =====
const particles = [];
function createExplosion(x,y,color) {
  for(let i=0;i<12;i++){
    const a=(Math.PI*2/12)*i, sp=2+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:20+Math.random()*10,color,size:2+Math.random()*3});
  }
}
function updateParticles() {
  for(let i=particles.length-1;i>=0;i--){
    particles[i].x+=particles[i].vx; particles[i].y+=particles[i].vy;
    particles[i].life--; if(particles[i].life<=0) particles.splice(i,1);
  }
}
function drawParticles() {
  for(const p of particles){
    ctx.globalAlpha=p.life/30; ctx.fillStyle=p.color;
    ctx.fillRect(Math.floor(p.x),Math.floor(p.y),Math.floor(p.size),Math.floor(p.size));
  }
  ctx.globalAlpha=1;
}

// ===== 충돌 =====
function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function checkCollisions() {
  const cfg = STAGE_CONFIG[stage-1];
  // 총알 vs 적
  for(let i=bullets.length-1;i>=0;i--){
    for(let j=enemies.length-1;j>=0;j--){
      if(rectsOverlap(bullets[i],enemies[j])){
        enemies[j].hp--; bullets.splice(i,1);
        if(enemies[j].hp<=0){
          const ex=enemies[j].x+enemies[j].w/2, ey=enemies[j].y+enemies[j].h/2;
          createExplosion(ex,ey,'#ff0');
          spawnItem(enemies[j].x, enemies[j].y); // 아이템 드롭 시도
          enemies.splice(j,1);
          score+=10; enemiesKilled++;
          playSound('explode');
          if(stage<5 && enemiesKilled>=cfg.killGoal){
            gameState='stageclear'; stageTransitionTimer=150; playSound('stageclear');
          }
        } else { playSound('bosshit'); }
        break;
      }
    }
    // 총알 vs 보스
    if(boss && i>=0 && i<bullets.length && rectsOverlap(bullets[i],boss)){
      boss.hp--; createExplosion(bullets[i].x,bullets[i].y,'#ff0');
      bullets.splice(i,1); playSound('bosshit');
    }
  }
  // 아이템 수집
  for(let i=items.length-1;i>=0;i--){
    if(rectsOverlap(player,items[i])){
      collectItem(items[i]); items.splice(i,1);
    }
  }
  // 적/적총알 vs 플레이어
  if(player.invincible<=0){
    for(let j=enemies.length-1;j>=0;j--){
      if(rectsOverlap(player,enemies[j])){
        createExplosion(player.x+player.w/2,player.y+player.h/2,'#0ff');
        enemies.splice(j,1);
        if(shieldActive){shieldActive=false;shieldTimer=0;} else loseLife();
        break;
      }
    }
    for(let i=enemyBullets.length-1;i>=0;i--){
      if(rectsOverlap(player,enemyBullets[i])){
        enemyBullets.splice(i,1);
        if(shieldActive){shieldActive=false;shieldTimer=0;}
        else { createExplosion(player.x+player.w/2,player.y+player.h/2,'#0ff'); loseLife(); }
        break;
      }
    }
    if(boss && rectsOverlap(player,boss)){
      createExplosion(player.x+player.w/2,player.y+player.h/2,'#0ff');
      if(shieldActive){shieldActive=false;shieldTimer=0;} else loseLife();
    }
  } else { player.invincible--; }
}

function loseLife(){
  lives--; player.invincible=90; playSound('hit');
  powerLevel = Math.max(powerLevel-1, 0);
  if(lives<=0){
    gameState='gameover';
    if(score>highScore){highScore=score;localStorage.setItem('spaceShooterHigh',highScore);}
    playSound('gameover');
  }
}

// ===== 입력 =====
const keys = {};
window.addEventListener('keydown',(e)=>{
  keys[e.code]=true;
  if(e.code==='Space'||e.code.startsWith('Arrow')) e.preventDefault();
  initAudio();
  if((gameState==='title'||gameState==='gameover')&&e.code==='Space') startGame();
});
window.addEventListener('keyup',(e)=>{keys[e.code]=false;});

// 모바일
const btnLeft=document.getElementById('btn-left');
const btnRight=document.getElementById('btn-right');
const btnUp=document.getElementById('btn-up');
const btnDown=document.getElementById('btn-down');
const btnFire=document.getElementById('btn-fire');
btnLeft.addEventListener('touchstart',(e)=>{e.preventDefault();keys['ArrowLeft']=true;initAudio();});
btnLeft.addEventListener('touchend',(e)=>{e.preventDefault();keys['ArrowLeft']=false;});
btnRight.addEventListener('touchstart',(e)=>{e.preventDefault();keys['ArrowRight']=true;initAudio();});
btnRight.addEventListener('touchend',(e)=>{e.preventDefault();keys['ArrowRight']=false;});
btnUp.addEventListener('touchstart',(e)=>{e.preventDefault();keys['ArrowUp']=true;initAudio();});
btnUp.addEventListener('touchend',(e)=>{e.preventDefault();keys['ArrowUp']=false;});
btnDown.addEventListener('touchstart',(e)=>{e.preventDefault();keys['ArrowDown']=true;initAudio();});
btnDown.addEventListener('touchend',(e)=>{e.preventDefault();keys['ArrowDown']=false;});
btnFire.addEventListener('touchstart',(e)=>{
  e.preventDefault();keys['Space']=true;initAudio();
  if(gameState==='title'||gameState==='gameover') startGame();
});
btnFire.addEventListener('touchend',(e)=>{e.preventDefault();keys['Space']=false;});

function handleInput(){
  const spd = speedBoost ? player.speed*1.6 : player.speed;
  if(keys['ArrowLeft']) player.x -= spd;
  if(keys['ArrowRight']) player.x += spd;
  if(keys['ArrowUp']) player.y -= spd;
  if(keys['ArrowDown']) player.y += spd;
  player.x = Math.max(0, Math.min(canvas.width-player.w, player.x));
  player.y = Math.max(40, Math.min(canvas.height-player.h-5, player.y));
  if(keys['Space']) shoot();
}

// ===== 게임 시작/리셋 =====
function startGame(){
  score=0; lives=3; stage=1; enemiesKilled=0;
  powerLevel=0; powerTimer=0; shieldActive=false; shieldTimer=0; speedBoost=false; speedTimer=0;
  bullets.length=0; enemies.length=0; particles.length=0;
  enemyBullets.length=0; items.length=0;
  enemySpawnTimer=0; shootCooldown=0; boss=null;
  itemMessage=''; itemMsgTimer=0;
  resetPlayer(); gameState='playing';
}
function nextStage(){
  stage++; enemiesKilled=0;
  bullets.length=0; enemies.length=0; enemyBullets.length=0; items.length=0;
  enemySpawnTimer=0;
  if(stage===5) createBoss();
  gameState='playing';
}

// ===== HUD =====
function drawHUD(){
  const cfg=STAGE_CONFIG[stage-1];
  ctx.fillStyle='#0ff'; ctx.font='14px "Courier New",monospace';
  ctx.textAlign='left'; ctx.fillText(`SCORE: ${score}`,10,22);
  ctx.textAlign='right'; ctx.fillText(`HI: ${highScore}`,canvas.width-10,22);
  ctx.textAlign='center'; ctx.fillStyle=cfg.color;
  ctx.fillText(`STAGE ${stage}`,canvas.width/2,22);
  // 목숨
  ctx.textAlign='left'; ctx.fillStyle='#f44';
  for(let i=0;i<lives;i++){
    const lx=10+i*18;
    ctx.fillRect(lx,30,6,6); ctx.fillRect(lx+8,30,6,6);
    ctx.fillRect(lx-2,32,14,4); ctx.fillRect(lx,36,10,4); ctx.fillRect(lx+2,40,6,2);
  }
  // 진행도
  if(stage<5){
    const p=enemiesKilled/cfg.killGoal;
    ctx.fillStyle='#333'; ctx.fillRect(canvas.width-110,32,100,8);
    ctx.fillStyle=cfg.color; ctx.fillRect(canvas.width-110,32,100*Math.min(p,1),8);
    ctx.strokeStyle='#fff'; ctx.strokeRect(canvas.width-110,32,100,8);
  }
  // 파워업 상태 아이콘
  let iconX = 10, iconY = 50;
  if(powerLevel>0){
    ctx.fillStyle='#f80'; ctx.font='11px "Courier New"';
    ctx.textAlign='left';
    ctx.fillText(`P${powerLevel} ${Math.ceil(powerTimer/60)}s`, iconX, iconY);
    iconY+=14;
  }
  if(shieldActive){
    ctx.fillStyle='#08f';
    ctx.fillText(`S ${Math.ceil(shieldTimer/60)}s`, iconX, iconY);
    iconY+=14;
  }
  if(speedBoost){
    ctx.fillStyle='#0f0';
    ctx.fillText(`▲ ${Math.ceil(speedTimer/60)}s`, iconX, iconY);
  }
  // 아이템 획득 메시지
  if(itemMsgTimer>0){
    ctx.globalAlpha=itemMsgTimer/90;
    ctx.fillStyle='#ff0'; ctx.font='bold 16px "Courier New"';
    ctx.textAlign='center';
    ctx.fillText(itemMessage, canvas.width/2, canvas.height/2-40);
    ctx.globalAlpha=1;
  }
}

// ===== 타이틀 =====
function drawTitle(){
  ctx.fillStyle='#0ff'; ctx.font='bold 26px "Courier New",monospace';
  ctx.textAlign='center';
  ctx.fillText('🚀 SPACE SHOOTER',canvas.width/2,canvas.height/4);
  ctx.fillStyle='#fff'; ctx.font='13px "Courier New",monospace';
  ctx.fillText('← → ↑ ↓ 이동 | SPACE 발사',canvas.width/2,canvas.height/3+10);
  ctx.fillText(`최고 점수: ${highScore}`,canvas.width/2,canvas.height/3+35);
  ctx.font='12px "Courier New",monospace';
  const sy=canvas.height/2;
  for(let i=0;i<5;i++){ctx.fillStyle=STAGE_CONFIG[i].color;ctx.fillText(STAGE_CONFIG[i].name,canvas.width/2,sy+i*22);}
  ctx.fillStyle='#aaa'; ctx.font='11px "Courier New"';
  ctx.fillText('아이템: P화력 S보호막 ▲속도 ♥목숨 B폭탄',canvas.width/2,sy+125);
  ctx.fillStyle=frameCount%40<20?'#ff0':'#f80'; ctx.font='15px "Courier New"';
  ctx.fillText('SPACE 또는 ● 버튼으로 시작',canvas.width/2,canvas.height*0.88);
}

// ===== 스테이지 클리어 =====
function drawStageClear(){
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,canvas.width,canvas.height);
  const cfg=STAGE_CONFIG[stage-1];
  ctx.textAlign='center';
  if(stage>=5&&!boss){
    ctx.fillStyle='#ff0'; ctx.font='bold 24px "Courier New"';
    ctx.fillText('★ ALL CLEAR ★',canvas.width/2,canvas.height/3);
    ctx.fillStyle='#fff'; ctx.font='16px "Courier New"';
    ctx.fillText(`최종 점수: ${score}`,canvas.width/2,canvas.height/2);
    ctx.fillText('축하합니다!',canvas.width/2,canvas.height/2+30);
    ctx.fillStyle=frameCount%40<20?'#0ff':'#0aa'; ctx.font='14px "Courier New"';
    ctx.fillText('SPACE로 재시작',canvas.width/2,canvas.height*0.7);
  } else {
    ctx.fillStyle=cfg.color; ctx.font='bold 24px "Courier New"';
    ctx.fillText(`STAGE ${stage} CLEAR!`,canvas.width/2,canvas.height/3);
    ctx.fillStyle='#fff'; ctx.font='14px "Courier New"';
    ctx.fillText(`다음: ${STAGE_CONFIG[stage].name}`,canvas.width/2,canvas.height/2);
  }
}

// ===== 게임오버 =====
function drawGameOver(){
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#f44'; ctx.font='bold 32px "Courier New"'; ctx.textAlign='center';
  ctx.fillText('GAME OVER',canvas.width/2,canvas.height/3);
  ctx.fillStyle='#fff'; ctx.font='16px "Courier New"';
  ctx.fillText(`점수: ${score}  (Stage ${stage})`,canvas.width/2,canvas.height/2);
  ctx.fillText(`최고 점수: ${highScore}`,canvas.width/2,canvas.height/2+30);
  if(score>=highScore&&score>0){ctx.fillStyle='#ff0';ctx.fillText('★ NEW HIGH SCORE ★',canvas.width/2,canvas.height/2+60);}
  ctx.fillStyle=frameCount%40<20?'#0ff':'#0aa'; ctx.font='14px "Courier New"';
  ctx.fillText('SPACE로 재시작',canvas.width/2,canvas.height*0.75);
}

// ===== 메인 루프 =====
let lastTime=0;
const frameInterval=1000/60;

function gameLoop(timestamp){
  const delta=timestamp-lastTime;
  if(delta>=frameInterval){
    lastTime=timestamp-(delta%frameInterval);
    frameCount++;
    ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
    updateStars(); drawStars();

    if(gameState==='title'){
      drawTitle();
    } else if(gameState==='playing'){
      handleInput();
      updateBullets(); updateEnemies(); updateEnemyBullets();
      updateItems(); updatePowerTimers();
      if(boss) updateBoss();
      checkCollisions(); updateParticles();
      drawBullets(); drawEnemyBullets(); drawItems();
      drawEnemies(); if(boss) drawBoss();
      drawPlayer(); drawParticles(); drawHUD();
    } else if(gameState==='stageclear'){
      updateParticles(); drawParticles(); drawPlayer(); drawStageClear();
      stageTransitionTimer--;
      if(stageTransitionTimer<=0){
        if(stage>=5&&!boss){
          gameState='gameover';
          if(score>highScore){highScore=score;localStorage.setItem('spaceShooterHigh',highScore);}
        } else nextStage();
      }
    } else if(gameState==='gameover'){
      updateParticles(); drawParticles(); drawGameOver();
    }
  }
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
